name: Sync Core Addon into UI

on:
  workflow_dispatch:
  push:
    branches:
      - github-action-for-automatic-workflow-with-ui
    paths-ignore:
      - "Build/Release/**"

permissions:
  contents: write

concurrency:
  group: sync-core-addon-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout UI repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure Build/Release exists
        run: mkdir -p Build/Release

      - name: Download latest Core release assets (.node)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -rf /tmp/core_release
          mkdir -p /tmp/core_release
          cd /tmp/core_release

          # Downloads assets from the *latest* GitHub Release in Dissonance-Eip/core
          gh release download --repo Dissonance-Eip/core --pattern "*.node" --dir .

          ls -lah .

      - name: Copy assets into Build/Release
        run: |
          cp -f /tmp/core_release/*.node Build/Release/ || true
          ls -lah Build/Release

      - name: Commit and push changes (if any)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add Build/Release/*.node || true

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore(ui): sync core addon binaries [skip ci]"
          git push
