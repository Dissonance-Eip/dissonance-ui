<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Dissonance UI (IPC demo)</title>
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;"
    />
    <style>
      body {
        margin: 0;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
        background: linear-gradient(to bottom, #1e3a8a, #ec4899);
        color: white;
        height: 100vh;
        display: flex;
        flex-direction: column;
      }

      header {
        padding: 1rem 1.5rem;
        text-align: center;
      }

      main {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: stretch;
        padding: 0 1.5rem 1.5rem;
        box-sizing: border-box;
        gap: 0.75rem;
      }

      .view[hidden] {
        display: none;
      }

      #welcome {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        padding: 1rem 0;
      }

      #mainView {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }

      #controls {
        display: flex;
        justify-content: center;
        gap: 0.75rem;
        margin-bottom: 0.5rem;
        align-items: center;
        flex-wrap: wrap;
      }

      #metaPanel {
        padding: 0.65rem 0.75rem;
        background: rgba(15, 23, 42, 0.35);
        border-radius: 0.5rem;
        display: grid;
        grid-template-columns: 110px 1fr;
        row-gap: 0.35rem;
        column-gap: 0.75rem;
        align-items: baseline;
      }

      #metaPanel .label {
        font-size: 0.85rem;
        color: #e5e7eb;
        opacity: 0.9;
      }

      #metaPanel .value {
        font-size: 0.85rem;
        color: #e5e7eb;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      #fileRow {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.75rem;
        padding: 0.5rem 0.75rem;
        background: rgba(15, 23, 42, 0.35);
        border-radius: 0.5rem;
      }

      #selectedFile {
        font-size: 0.85rem;
        color: #e5e7eb;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      #changeFileBtn {
        appearance: none;
        border: 1px solid rgba(248, 250, 252, 0.35);
        background: rgba(15, 23, 42, 0.35);
        color: #e5e7eb;
        border-radius: 999px;
        padding: 0.35rem 0.9rem;
        font-size: 0.85rem;
        cursor: pointer;
      }

      #dropZone {
        border: 2px dashed rgba(248, 250, 252, 0.7);
        border-radius: 0.75rem;
        padding: 1rem 1.5rem;
        text-align: center;
        font-size: 0.9rem;
        color: #e5e7eb;
        background: rgba(15, 23, 42, 0.4);
        cursor: pointer;
        min-width: 260px;
      }

      #dropZone.dragover {
        border-color: #fbbf24;
        background: rgba(15, 23, 42, 0.8);
      }

      #dropZone span.accent {
        color: #60a5fa; /* blue-400 */
        font-weight: 600;
      }

      #processBtn,
      #exportBtn {
        appearance: none;
        border: none;
        border-radius: 999px;
        padding: 0.45rem 1.1rem;
        font-size: 0.9rem;
        font-weight: 500;
        cursor: pointer;
        color: #0f172a;
        opacity: 0.6;
      }

      #processBtn {
        background: #facc15; /* amber */
      }

      #exportBtn {
        background: #6ee7b7; /* emerald */
      }

      #processBtn.enabled,
      #exportBtn.enabled {
        opacity: 1;
      }

      #processBtn:disabled,
      #exportBtn:disabled {
        cursor: default;
      }

      #log-container {
        display: none;
      }

      #status {
        display: none;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Dissonance UI</h1>
      <p>Import an audio file, then process and export it via simulated dissonance-core.</p>
    </header>
    <main>
      <section id="view-welcome" class="view">
        <div id="welcome">
          <div id="dropZone">
            Drop an audio file here or <span class="accent">choose file</span>
          </div>
        </div>
      </section>

      <section id="view-main" class="view" hidden>
        <div id="mainView">
          <div id="fileRow">
            <div id="selectedFile">No file selected</div>
            <button id="changeFileBtn" type="button">Change file</button>
          </div>

          <div id="controls">
            <button id="processBtn" type="button" disabled>Process</button>
            <button id="exportBtn" type="button" disabled>Export</button>
          </div>

          <div id="metaPanel" aria-label="WAV basic info">
            <div class="label">Filename</div>
            <div id="metaFilename" class="value">—</div>

            <div class="label">Duration</div>
            <div id="metaDuration" class="value">—</div>

            <div class="label">Sample rate</div>
            <div id="metaSampleRate" class="value">—</div>

            <div class="label">Channels</div>
            <div id="metaChannels" class="value">—</div>
          </div>
        </div>
      </section>
    </main>
    <script type="module" src="./renderer/index.js"></script>
  </body>
</html>
