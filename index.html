<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Dissonance UI (IPC demo)</title>
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header>
      <h1>Dissonance UI</h1>
      <p>Import an audio file, then process and export it via simulated dissonance-core.</p>
    </header>
    <main>
      <section id="view-welcome" class="view">
        <div id="welcome">
          <div id="dropZone">
            <svg
              class="dropZoneIcon"
              viewBox="0 0 24 24"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
              aria-hidden="true"
            >
              <path
                d="M8 10L12 6L16 10"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
              <path
                d="M12 6V16"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
              />
              <path
                d="M5 18.5C5 17.6716 5.67157 17 6.5 17H17.5C18.3284 17 19 17.6716 19 18.5C19 19.3284 18.3284 20 17.5 20H6.5C5.67157 20 5 19.3284 5 18.5Z"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linejoin="round"
              />
              <path
                d="M8 4.5H6.5C5.67157 4.5 5 5.17157 5 6V7.5"
                stroke="currentColor"
                stroke-width="1.4"
                stroke-linecap="round"
              />
              <path
                d="M16 4.5H17.5C18.3284 4.5 19 5.17157 19 6V7.5"
                stroke="currentColor"
                stroke-width="1.4"
                stroke-linecap="round"
              />
            </svg>
            <div class="dropZoneText">
              Drop an audio file here or <span class="accent">choose file</span>
            </div>
          </div>
        </div>
      </section>

      <section id="view-main" class="view" hidden>
        <div id="mainView">
          <div id="fileRow">
            <div id="selectedFile">No file selected</div>
            <button id="changeFileBtn" type="button">Change file</button>
          </div>

          <div id="controls">
            <button id="processBtn" type="button" disabled>Process</button>
            <button id="exportBtn" type="button" disabled>Export</button>
          </div>

          <div id="metaPanel" aria-label="WAV basic info">
            <div class="label">Filename</div>
            <div id="metaFilename" class="value">—</div>

            <div class="label">Duration</div>
            <div id="metaDuration" class="value">—</div>

            <div class="label">Sample rate</div>
            <div id="metaSampleRate" class="value">—</div>

            <div class="label">Channels</div>
            <div id="metaChannels" class="value">—</div>
          </div>
        </div>
      </section>
    </main>
    <script type="module" src="./renderer/index.js"></script>
  </body>
</html>
